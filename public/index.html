<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fakemon Posts</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="view">
        <button id="button-any" class="pressed" onclick='window.location.href="https://localhost/favorites.html";'>View creations!</button>
        <button id="button-fav" class="unpressed" onclick="">View your favorites!</button>
        <button id="create" class="unpressed">Post your own!</button>
        <button id="creations" class="unpressed">View your own creations!</button>
    </div>
    <select id="sort">
        <option value="-postedOn">Date Newest</option>
        <option value="postedOn">Date Oldest</option>
        <option value="-likes">Most liked</option>
        <option value="likes">Least liked I guess</option>
    </select>

    <div class="container visible" id="fakemon-holder">
        <div class="card" id="fakemon-example">
            <img src="" alt="fakemon-image" id="image">
            <h2 id="name">example</h2>
        </div>
        <div id="no-content">
            <h1>Uh-Oh! No fakemon yet!</h1>
        </div>
    </div>
    <script type="module" src="./home.js"></script>
</body>
</html>
